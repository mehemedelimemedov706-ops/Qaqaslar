<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чат Qaqaslar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2b002f;          /* самый тёмный фон за чатом */
    --panel: #36003a;       /* основной фон (как на сайте) */
    --panel-2: #470050;     /* чуть светлее: поле ввода, чужие сообщения */
    --ink: #f3d9f7;         /* основной текст */
    --muted: #a04aa8;       /* приглушённый сиреневый */
    --me: #7a1a8f;          /* мои сообщения */
    --me-ink: #ffffff;
    --accent: #b020c0;      /* кнопка отправки */
    --line: #6a0a6e;        /* рамки */
    --glow: rgba(200, 60, 220, .35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    box-shadow: 0 0 50px rgba(160, 20, 180, .35);
  }
  header {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--line);
    background: var(--panel);
  }
  header h1 {
    font-size: 20px; font-weight: 800; margin: 0;
    text-transform: uppercase; letter-spacing: .5px; color: #d36be0;
  }
  header .who { font-size: 14px; color: var(--muted); }
  header .who b { color: var(--ink); }
  header button.link {
    background: none; border: none; color: #d36be0; font: inherit;
    font-weight: 800; cursor: pointer; padding: 0 0 0 8px;
  }
  header button.link:hover { color: #fff; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--bg);
    scrollbar-color: var(--line) var(--bg);
  }
  .empty { margin: auto; color: var(--muted); text-align: center; font-weight: 800; }
  .row { display: flex; flex-direction: column; max-width: 78%; }
  .row.mine { align-self: flex-end; align-items: flex-end; }
  .row.theirs { align-self: flex-start; align-items: flex-start; }
  .name { font-size: 13px; font-weight: 800; margin: 8px 4px 2px; text-transform: uppercase; }
  .bubble {
    padding: 9px 14px;
    border-radius: 18px;
    line-height: 1.4;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    font-size: 16px;
  }
  .theirs .bubble {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-bottom-left-radius: 5px;
  }
  .mine .bubble {
    background: var(--me);
    color: var(--me-ink);
    border-bottom-right-radius: 5px;
    box-shadow: 0 0 14px var(--glow);
  }
  .time { font-size: 11px; color: var(--muted); margin: 2px 6px 0; }
  .pop { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .pop { animation: none; } }

  .emoji-bar {
    display: none;
    flex-wrap: wrap;
    gap: 4px;
    padding: 8px 14px;
    border-top: 2px solid var(--line);
    background: var(--panel);
  }
  .emoji-bar.open { display: flex; }
  .emoji-bar button {
    font-size: 22px; background: none; border: none; cursor: pointer;
    border-radius: 8px; padding: 2px 5px;
  }
  .emoji-bar button:hover { background: var(--panel-2); }

  form.composer {
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    border-top: 2px solid var(--line);
    background: var(--panel);
    align-items: flex-end;
  }
  form.composer textarea {
    flex: 1;
    resize: none;
    max-height: 120px;
    font: inherit;
    font-size: 16px;
    padding: 10px 14px;
    border: 2px solid var(--line);
    border-radius: 20px;
    outline: none;
    color: var(--ink);
    background: #200024;
  }
  form.composer textarea::placeholder { color: var(--muted); }
  form.composer textarea:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--glow); }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line);
    background: var(--panel-2); font-size: 22px; cursor: pointer; flex: none;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .send {
    height: 44px; padding: 0 20px; border: none; border-radius: 22px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 800;
    text-transform: uppercase; letter-spacing: .5px;
    cursor: pointer; flex: none;
  }
  .send:hover { background: #c83cd8; }
  .send:disabled { opacity: .5; cursor: default; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid #e06cf0; outline-offset: 2px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(20, 0, 24, .8);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10;
  }
  .overlay[hidden] { display: none; }
  .card {
    background: var(--panel); border: 2px solid var(--line); border-radius: 20px;
    padding: 28px; width: 100%; max-width: 380px;
    box-shadow: 0 0 40px var(--glow);
  }
  .card h2 { margin: 0 0 6px; font-size: 24px; color: #d36be0; }
  .card p { margin: 0 0 18px; color: var(--muted); }
  .card input {
    width: 100%; font: inherit; font-size: 17px; padding: 12px 14px;
    border: 2px solid var(--line); border-radius: 14px; margin-bottom: 14px;
    background: #200024; color: var(--ink);
  }
  .card button {
    width: 100%; height: 48px; border: none; border-radius: 14px; background: var(--accent);
    color: #fff; font: inherit; font-weight: 800; font-size: 17px; cursor: pointer;
    text-transform: uppercase;
  }
  .card button:hover { background: #c83cd8; }
  .warn {
    background: #4a0a3a; color: #ffc6f2; padding: 12px 16px; font-size: 14px;
    border-bottom: 1px solid var(--line);
  }
  .warn[hidden] { display: none; }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>💬 Чат Qaqaslar</h1>
    <div class="who">Ты: <b id="whoName">—</b><button class="link" id="changeName" type="button">сменить</button></div>
  </header>
  <div class="warn" id="warn" hidden></div>
  <div id="messages" aria-live="polite">
    <div class="empty" id="empty">Пока тихо. Напиши первое сообщение!</div>
  </div>
  <div class="emoji-bar" id="emojiBar"></div>
  <form class="composer" id="composer" autocomplete="off">
    <button class="icon-btn" id="emojiBtn" type="button" aria-label="Смайлики">😊</button>
    <textarea id="text" rows="1" maxlength="500" placeholder="Напиши сообщение…"></textarea>
    <button class="send" id="sendBtn" type="submit">Отправить</button>
  </form>
</div>

<div class="overlay" id="login" hidden>
  <form class="card" id="loginForm">
    <h2>Привет! 👋</h2>
    <p>Как тебя зовут в чате?</p>
    <input id="nameInput" maxlength="20" placeholder="Твоё имя" required>
    <button type="submit">Войти в чат</button>
  </form>
</div>

<script>
  const FORM_URL   = "https://docs.google.com/forms/d/e/1FAIpQLSf6KMPHH1yTr_lz7OQk8rq_toJoWTF2MxO1R_X3bElUSU6TkA/formResponse";
  const ENTRY_NAME = "entry.1070875154";
  const ENTRY_TEXT = "entry.1549852739";
  const ENTRY_ID   = "entry.1874645593";
  const SHEET_ID   = "140_dIam0TjLJxRJK499kdONap3KuS-YsPj-ZSlxDwZs";
  const POLL_MS = 5000;   // как часто проверять новые сообщения

  const $ = (id) => document.getElementById(id);
  const messagesEl = $("messages");
  const emptyEl = $("empty");
  const textEl = $("text");
  const sendBtn = $("sendBtn");
  const warnEl = $("warn");

  function showWarn(msg) { warnEl.hidden = false; warnEl.textContent = msg; }
  function hideWarn() { warnEl.hidden = true; }

  // ---------- имя ----------
  let myName = "";
  try { myName = localStorage.getItem("chatName") || ""; } catch (e) {}

  function setName(name) {
    myName = name.trim().slice(0, 20);
    try { localStorage.setItem("chatName", myName); } catch (e) {}
    $("whoName").textContent = myName || "—";
  }
  function askName() {
    $("nameInput").value = myName;
    $("login").hidden = false;
    $("nameInput").focus();
  }
  $("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = $("nameInput").value.trim();
    if (!v) return;
    setName(v);
    $("login").hidden = true;
    textEl.focus();
  });
  $("changeName").addEventListener("click", askName);
  if (myName) setName(myName); else askName();

  // цвета имён — светлые, чтобы читались на тёмно-фиолетовом фоне
  function colorFor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return `hsl(${h}, 70%, 70%)`;
  }

  // ---------- смайлики ----------
  const emojis = ["😀","😂","🤣","😍","😎","🥳","😭","😡","👍","👎","🙏","🔥","❤️","💔","🎉","🤝","😴","🤔","🙌","👀","⚽","🎮","🍕","☕"];
  const bar = $("emojiBar");
  emojis.forEach((em) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = em;
    b.addEventListener("click", () => { textEl.value += em; textEl.focus(); });
    bar.appendChild(b);
  });
  $("emojiBtn").addEventListener("click", () => bar.classList.toggle("open"));

  // ---------- вывод сообщений ----------
  const seen = new Set();
  let lastAuthor = null;
  let firstLoad = true;

  function timeStr(ts) {
    const d = new Date(ts || Date.now());
    return d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  }

  function addMessage(m) {
    if (seen.has(m.id)) return;
    seen.add(m.id);
    if (emptyEl.parentNode) emptyEl.remove();

    const mine = m.name === myName;
    const nearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;

    const row = document.createElement("div");
    row.className = "row " + (mine ? "mine" : "theirs") + (firstLoad ? "" : " pop");

    if (!mine && lastAuthor !== m.name) {
      const n = document.createElement("div");
      n.className = "name";
      n.textContent = m.name;
      n.style.color = colorFor(String(m.name));
      row.appendChild(n);
    }
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = m.text;        // textContent защищает от вставки вредного кода
    row.appendChild(b);

    const t = document.createElement("div");
    t.className = "time";
    t.textContent = timeStr(m.time);
    row.appendChild(t);

    messagesEl.appendChild(row);
    lastAuthor = m.name;

    if (mine || nearBottom || firstLoad) messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ---------- чтение сообщений из Google Таблицы ----------
  function timeFromId(id) { return Number(String(id).split("-")[0]) || 0; }

  let failCount = 0;
  window.chatCallback = function (resp) {
    try {
      const rows = (resp.table && resp.table.rows) || [];
      const list = rows.map((r) => {
        const c = r.c || [];
        const id = c[2] && c[2].v != null ? String(c[2].v) : "";
        return {
          name: c[0] && c[0].v != null ? String(c[0].v) : "",
          text: c[1] && c[1].v != null ? String(c[1].v) : "",
          id: id,
          time: timeFromId(id)
        };
      }).filter((m) => m.name && m.text && m.id);
      list.sort((a, b) => a.time - b.time).forEach(addMessage);
      firstLoad = false;
      failCount = 0;
      hideWarn();
    } catch (e) { failCount++; }
  };

  function loadMessages() {
    return new Promise((resolve) => {
      const q = encodeURIComponent("select B,C,D order by A desc limit 100");
      const s = document.createElement("script");
      s.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
              "/gviz/tq?tqx=out:json;responseHandler:chatCallback&tq=" + q +
              "&_=" + Date.now();
      s.onload = () => { s.remove(); resolve(); };
      s.onerror = () => {
        s.remove();
        failCount++;
        if (failCount >= 3) showWarn("Не удаётся прочитать таблицу. Проверь, что у таблицы доступ «Все, у кого есть ссылка».");
        resolve();
      };
      document.head.appendChild(s);
    });
  }

  async function poll() {
    if (!document.hidden) await loadMessages();
    setTimeout(poll, POLL_MS);
  }
  poll();
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) loadMessages();
  });

  // ---------- отправка через Google Форму ----------
  let lastSent = 0;
  async function send() {
    const text = textEl.value.trim();
    if (!text) return;
    if (!myName) { askName(); return; }
    const now = Date.now();
    if (now - lastSent < 800) return;          // защита от спама
    lastSent = now;
    textEl.value = "";
    autoGrow();

    const msg = {
      id: now + "-" + Math.random().toString(36).slice(2, 8),
      name: myName,
      text: text.slice(0, 500),
      time: now
    };
    addMessage(msg);                            // сразу показываем у себя

    const body = new URLSearchParams();
    body.append(ENTRY_NAME, msg.name);
    body.append(ENTRY_TEXT, msg.text);
    body.append(ENTRY_ID, msg.id);
    try {
      await fetch(FORM_URL, { method: "POST", mode: "no-cors", body: body });
    } catch (err) {
      showWarn("Сообщение не отправилось. Проверь интернет.");
    }
  }

  $("composer").addEventListener("submit", (e) => { e.preventDefault(); send(); });
  textEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  function autoGrow() {
    textEl.style.height = "auto";
    textEl.style.height = Math.min(textEl.scrollHeight, 120) + "px";
  }
  textEl.addEventListener("input", autoGrow);
</script>
</body>
</html>
