<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рабочий чат</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            background-color: #1a1a2e; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background-color: #16213e;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #0f3460;
        }

        .chat-header {
            background-color: #0f3460;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #1a1a2e;
        }

        .chat-header h1 {
            font-size: 1.4rem;
            color: #e94560;
            letter-spacing: 1px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.4;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .message.received {
            background-color: #0f3460;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.sent {
            background-color: #e94560;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .author {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 4px;
            color: #b2bec3;
        }

        .chat-input-area {
            padding: 15px;
            background-color: #0f3460;
            display: flex;
            gap: 10px;
            border-top: 1px solid #1a1a2e;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid #1a1a2e;
            background-color: #16213e;
            color: #ffffff;
            outline: none;
            font-size: 0.95rem;
        }

        .chat-input-area input::placeholder {
            color: #7f8c8d;
        }

        .chat-input-area button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .chat-input-area button:hover {
            background-color: #ff6b6b;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h1>ОБЩИЙ ЧАТ</h1>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message received">
                <div class="author">Система</div>
                Добро пожаловать! Напишите первое сообщение.
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Введите сообщение...">
            <button id="sendButton">Отправить</button>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // Добавляем сообщение пользователя
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', 'sent');
            messageDiv.innerHTML = `<div class="author">Вы</div>${escapeHtml(text)}`;
            messagesContainer.appendChild(messageDiv);

            messageInput.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Имитация автоматического ответа через 1 секунду
            setTimeout(() => {
                const replyDiv = document.createElement('div');
                replyDiv.classList.add('message', 'received');
                replyDiv.innerHTML = `<div class="author">Собеседник</div>Эхо: ${escapeHtml(text)}`;
                messagesContainer.appendChild(replyDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 1000);
        }

        // Защита от XSS-инъекций при вводе текста
        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
