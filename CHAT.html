<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чат Qaqaslar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9f0ff;
    --panel: #ffffff;
    --ink: #1b2340;
    --muted: #6b7699;
    --me: #2d5bff;
    --me-ink: #ffffff;
    --accent: #ff6b57;
    --line: #d5dff5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    box-shadow: 0 0 40px rgba(45, 91, 255, .12);
  }
  header {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 20px; font-weight: 800; margin: 0; }
  header .who { font-size: 14px; color: var(--muted); }
  header button.link {
    background: none; border: none; color: var(--me); font: inherit;
    font-weight: 600; cursor: pointer; padding: 0 0 0 8px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--bg);
  }
  .empty { margin: auto; color: var(--muted); text-align: center; }
  .row { display: flex; flex-direction: column; max-width: 78%; }
  .row.mine { align-self: flex-end; align-items: flex-end; }
  .row.theirs { align-self: flex-start; align-items: flex-start; }
  .name { font-size: 13px; font-weight: 800; margin: 8px 4px 2px; }
  .bubble {
    padding: 9px 14px;
    border-radius: 18px;
    line-height: 1.4;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    font-size: 16px;
  }
  .theirs .bubble { background: #fff; border-bottom-left-radius: 5px; box-shadow: 0 1px 2px rgba(27, 35, 64, .08); }
  .mine .bubble { background: var(--me); color: var(--me-ink); border-bottom-right-radius: 5px; }
  .time { font-size: 11px; color: var(--muted); margin: 2px 6px 0; }
  .pop { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .pop { animation: none; } }

  .emoji-bar {
    display: none;
    flex-wrap: wrap;
    gap: 4px;
    padding: 8px 14px;
    border-top: 1px solid var(--line);
    background: var(--panel);
  }
  .emoji-bar.open { display: flex; }
  .emoji-bar button {
    font-size: 22px; background: none; border: none; cursor: pointer;
    border-radius: 8px; padding: 2px 5px;
  }
  .emoji-bar button:hover { background: var(--bg); }

  form.composer {
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid var(--line);
    background: var(--panel);
    align-items: flex-end;
  }
  form.composer textarea {
    flex: 1;
    resize: none;
    max-height: 120px;
    font: inherit;
    font-size: 16px;
    padding: 10px 14px;
    border: 2px solid var(--line);
    border-radius: 20px;
    outline: none;
    color: var(--ink);
  }
  form.composer textarea:focus { border-color: var(--me); }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--bg); font-size: 22px; cursor: pointer; flex: none;
  }
  .send {
    height: 44px; padding: 0 20px; border: none; border-radius: 22px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 800;
    cursor: pointer; flex: none;
  }
  .send:disabled { opacity: .5; cursor: default; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Окно входа */
  .overlay {
    position: fixed; inset: 0; background: rgba(27, 35, 64, .55);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10;
  }
  .overlay[hidden] { display: none; }
  .card {
    background: #fff; border-radius: 20px; padding: 28px; width: 100%; max-width: 380px;
  }
  .card h2 { margin: 0 0 6px; font-size: 24px; }
  .card p { margin: 0 0 18px; color: var(--muted); }
  .card input {
    width: 100%; font: inherit; font-size: 17px; padding: 12px 14px;
    border: 2px solid var(--line); border-radius: 14px; margin-bottom: 14px;
  }
  .card button {
    width: 100%; height: 48px; border: none; border-radius: 14px; background: var(--me);
    color: #fff; font: inherit; font-weight: 800; font-size: 17px; cursor: pointer;
  }
  .warn {
    background: #fff3d6; color: #6a4b00; padding: 12px 16px; font-size: 14px;
    border-bottom: 1px solid #f0d890;
  }
  .warn[hidden] { display: none; }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>💬 Чат Qaqaslar</h1>
    <div class="who">Ты: <b id="whoName">—</b><button class="link" id="changeName" type="button">сменить</button></div>
  </header>
  <div class="warn" id="warn" hidden></div>
  <div id="messages" aria-live="polite">
    <div class="empty" id="empty">Пока тихо. Напиши первое сообщение!</div>
  </div>
  <div class="emoji-bar" id="emojiBar"></div>
  <form class="composer" id="composer" autocomplete="off">
    <button class="icon-btn" id="emojiBtn" type="button" aria-label="Смайлики">😊</button>
    <textarea id="text" rows="1" maxlength="500" placeholder="Напиши сообщение…"></textarea>
    <button class="send" id="sendBtn" type="submit">Отправить</button>
  </form>
</div>

<div class="overlay" id="login" hidden>
  <form class="card" id="loginForm">
    <h2>Привет! 👋</h2>
    <p>Как тебя зовут в чате?</p>
    <input id="nameInput" maxlength="20" placeholder="Твоё имя" required>
    <button type="submit">Войти в чат</button>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, push, query, limitToLast, onChildAdded, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // ============================================================
  //  ВСТАВЬ СЮДА СВОИ ДАННЫЕ ИЗ FIREBASE
  // ============================================================
  const firebaseConfig = {
    apiKey: "ВСТАВЬ_СЮДА",
    authDomain: "ВСТАВЬ_СЮДА",
    databaseURL: "ВСТАВЬ_СЮДА",
    projectId: "ВСТАВЬ_СЮДА",
    storageBucket: "ВСТАВЬ_СЮДА",
    messagingSenderId: "ВСТАВЬ_СЮДА",
    appId: "ВСТАВЬ_СЮДА"
  };

  const $ = (id) => document.getElementById(id);
  const messagesEl = $("messages");
  const emptyEl = $("empty");
  const textEl = $("text");
  const sendBtn = $("sendBtn");
  const warnEl = $("warn");

  const configured = !String(firebaseConfig.databaseURL).includes("ВСТАВЬ");
  if (!configured) {
    warnEl.hidden = false;
    warnEl.textContent = "Чат ещё не подключён к Firebase: вставь свои данные в блок firebaseConfig в файле chat.html.";
    sendBtn.disabled = true;
  }

  // ---------- имя пользователя ----------
  let myName = "";
  try { myName = localStorage.getItem("chatName") || ""; } catch (e) {}

  function setName(name) {
    myName = name.trim().slice(0, 20);
    try { localStorage.setItem("chatName", myName); } catch (e) {}
    $("whoName").textContent = myName || "—";
  }
  function askName() {
    $("nameInput").value = myName;
    $("login").hidden = false;
    $("nameInput").focus();
  }
  $("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = $("nameInput").value.trim();
    if (!v) return;
    setName(v);
    $("login").hidden = true;
    textEl.focus();
  });
  $("changeName").addEventListener("click", askName);
  if (myName) setName(myName); else askName();

  // ---------- цвет имени ----------
  function colorFor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return `hsl(${h}, 65%, 38%)`;
  }

  // ---------- смайлики ----------
  const emojis = ["😀","😂","🤣","😍","😎","🥳","😭","😡","👍","👎","🙏","🔥","❤️","💔","🎉","🤝","😴","🤔","🙌","👀","⚽","🎮","🍕","☕"];
  const bar = $("emojiBar");
  emojis.forEach((em) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = em;
    b.addEventListener("click", () => {
      textEl.value += em;
      textEl.focus();
    });
    bar.appendChild(b);
  });
  $("emojiBtn").addEventListener("click", () => bar.classList.toggle("open"));

  // ---------- вывод сообщений ----------
  const seen = new Set();
  let lastAuthor = null;
  let firstLoad = true;

  function timeStr(ts) {
    const d = new Date(ts || Date.now());
    return d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  }

  function addMessage(id, m) {
    if (seen.has(id)) return;
    seen.add(id);
    if (emptyEl.parentNode) emptyEl.remove();

    const mine = m.name === myName;
    const nearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;

    const row = document.createElement("div");
    row.className = "row " + (mine ? "mine" : "theirs") + (firstLoad ? "" : " pop");

    if (!mine && lastAuthor !== m.name) {
      const n = document.createElement("div");
      n.className = "name";
      n.textContent = m.name;
      n.style.color = colorFor(m.name);
      row.appendChild(n);
    }
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = m.text;          // textContent защищает от вставки вредного кода
    row.appendChild(b);

    const t = document.createElement("div");
    t.className = "time";
    t.textContent = timeStr(m.time);
    row.appendChild(t);

    messagesEl.appendChild(row);
    lastAuthor = m.name;

    if (mine || nearBottom || firstLoad) messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ---------- Firebase ----------
  let db = null;
  if (configured) {
    try {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
      const q = query(ref(db, "messages"), limitToLast(100));
      onChildAdded(q, (snap) => addMessage(snap.key, snap.val()));
      setTimeout(() => { firstLoad = false; messagesEl.scrollTop = messagesEl.scrollHeight; }, 1500);
    } catch (err) {
      warnEl.hidden = false;
      warnEl.textContent = "Не удалось подключиться к Firebase. Проверь данные в firebaseConfig.";
    }
  }

  // ---------- отправка ----------
  let lastSent = 0;
  async function send() {
    const text = textEl.value.trim();
    if (!text || !db) return;
    if (!myName) { askName(); return; }
    const now = Date.now();
    if (now - lastSent < 800) return;           // защита от спама
    lastSent = now;
    textEl.value = "";
    autoGrow();
    try {
      await push(ref(db, "messages"), {
        name: myName,
        text: text.slice(0, 500),
        time: serverTimestamp()
      });
    } catch (err) {
      warnEl.hidden = false;
      warnEl.textContent = "Сообщение не отправилось. Проверь правила базы данных в Firebase.";
    }
  }

  $("composer").addEventListener("submit", (e) => { e.preventDefault(); send(); });
  textEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  function autoGrow() {
    textEl.style.height = "auto";
    textEl.style.height = Math.min(textEl.scrollHeight, 120) + "px";
  }
  textEl.addEventListener("input", autoGrow);
</script>
</body>
</html>
