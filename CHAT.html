<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAU KRUQU — Чат</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            background-color: #1a001a; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #e0d0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background-color: #2b002b;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #4a004a;
        }

        .chat-header {
            background-color: #3d003d;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #5a005a;
        }

        .chat-header h1 {
            font-size: 1.4rem;
            color: #d67ad6;
            letter-spacing: 1px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.4;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .message.received {
            background-color: #4a004a;
            color: #f3cfeb;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.sent {
            background-color: #7b1fa2;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .author {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 4px;
            color: #b384b0;
        }

        .chat-input-area {
            padding: 15px;
            background-color: #3d003d;
            display: flex;
            gap: 10px;
            border-top: 1px solid #5a005a;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid #660055;
            background-color: #2b002b;
            color: #ffffff;
            outline: none;
            font-size: 0.95rem;
        }

        .chat-input-area input::placeholder {
            color: #8c5387;
        }

        .chat-input-area button {
            background-color: #8e24aa;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .chat-input-area button:hover {
            background-color: #ab47bc;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h1>GAU KRUQU CHAT</h1>
        </div>

        <div class="chat-messages">
            <div class="message received">
                <div class="author">N1HAT</div>
                Всем привет! Добро пожаловать в чат.
            </div>

            <div class="message sent">
                <div class="author">Вы</div>
                Привет! Отличный дизайн получился.
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" placeholder="Введите сообщение...">
            <button>Отправить</button>
        </div>
    </div>

</body>
</html>
